version: "3.9"

services:
  cysymo:
    build: .
    container_name: cysymo-app
    ports:
      - "8000:8000"
    volumes:
      # persist the SQLite database outside the container
      - cysymo-data:/data
    env_file:
      - .env
    environment:
      - CYSYMO_DB_PATH=/data/cysymo_data.db
    restart: unless-stopped

volumes:
  cysymo-data:
    driver: local
